name: Restore M5M cat app icons

on:
  workflow_dispatch:
  push:
    paths:
      - "icons/icon-192.png"
      - "icons/icon-512.png"
      - ".github/workflows/restore-m5m-cat-icons.yml"

permissions:
  contents: write

jobs:
  restore-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify cat icons exist
        shell: bash
        run: |
          test -f icons/icon-192.png
          test -f icons/icon-512.png

      - name: Bump manifest and service-worker cache only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          # manifest: оставляем всё как есть, меняем только start_url,
          # чтобы Android увидел новую установленную версию ярлыка.
          mp = Path("manifest.webmanifest")
          data = json.loads(mp.read_text(encoding="utf-8"))
          data["start_url"] = "./?app=cat-icon-v1"
          # Иконки остаются по тем же путям; файлы заменены на кота.
          mp.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")

          # Новый cache namespace, чтобы старые RAW V2 иконки не брались из PWA-кэша.
          sp = Path("sw.js")
          s = sp.read_text(encoding="utf-8")
          s = re.sub(
              r"const CACHE='[^']+';",
              "const CACHE='m5m-cat-icons-20260821-v1';",
              s,
              count=1
          )
          sp.write_text(s, encoding="utf-8")
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "Cat icons already installed."
            exit 0
          fi
          git commit -m "Restore M5M cat app icons"
          git push
