name: M5M · Stoloto AUTO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m5m-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Кто запустил
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "ACTOR=$GITHUB_ACTOR"
          echo "RUN=$GITHUB_RUN_ID"

      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Взять самый свежий main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "WORKING_SHA=$(git rev-parse HEAD)"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Кэш Chromium Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.0-chromium

      - name: Установить зависимости
        run: |
          python -m pip install --disable-pip-version-check --no-input "playwright==1.54.0" "openpyxl==3.1.5"
          python -m playwright install --with-deps chromium

      - name: Столото OAuth · последние 10 · 3 проверки · обновить M5M
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: python scripts/m5m_stoloto_sync.py

      - name: Пересчитать временную статистику
        run: python scripts/build_time_stats.py

      - name: Сохранить безопасное обновление
        run: |
          if git diff --quiet -- data/archive.json data/m5m_stolby_po_date_vremeni.xlsx data/last_sync.json data/time_stats.json; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/archive.json
          git add data/m5m_stolby_po_date_vremeni.xlsx
          git add data/last_sync.json
          git add data/time_stats.json

          git commit -m "M5M · Столото автообновление"
          git push origin main
