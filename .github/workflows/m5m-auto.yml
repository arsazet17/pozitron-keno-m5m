name: M5M · Stoloto AUTO
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m5m-stoloto-auto
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.0-chromium
      - name: Dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input "playwright==1.54.0" "openpyxl==3.1.5"
          python -m playwright install --with-deps chromium
      - name: Read Stoloto and update M5M
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: python scripts/m5m_stoloto_sync.py
      - name: Commit data
        run: |
          if git diff --quiet -- data/archive.json data/m5m_stolby_po_date_vremeni.xlsx data/last_sync.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/m5m_stolby_po_date_vremeni.xlsx data/last_sync.json
          git commit -m "M5M · Stoloto auto update"
          git push origin main
