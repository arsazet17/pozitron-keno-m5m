name: APPLY · M5M Algorithm history control v1.2.7

on:
  push:
    branches: [main]
    paths:
      - 'APPLY_M5M_ALGO_UI_V127.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: m5m-ui-writer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply algorithm history control and stable refresh
        run: python APPLY_M5M_ALGO_UI_V127.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Smoke check
        run: |
          grep -q 'id="algoHistoryCount"' index.html
          grep -q 'ALGO_HISTORY_COUNT_KEY' app.js
          grep -q 'm5m-runtime-direct-v9-20260924' sw.js
          grep -q 'v1.2.7' index.html

      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js style.css sw.js
          if git diff --cached --quiet; then
            echo 'No app changes to commit'
            exit 0
          fi
          git commit -m 'M5M v1.2.7: adjustable algorithm history and stable refresh'
          git push origin HEAD:main
