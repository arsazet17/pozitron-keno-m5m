name: APPLY · M5M Algorithm days v1.2.8

on:
  push:
    branches: [main]
    paths:
      - 'APPLY_M5M_ALGO_DAYS_V128.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: m5m-algo-days-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply day matrix patch
        run: python APPLY_M5M_ALGO_DAYS_V128.py
      - name: Build compact algorithm history now
        run: node scripts/m5m_build_runtime.js
      - name: Syntax checks
        run: |
          node --check app.js
          node --check runtime-direct.js
          node --check matrix-result-signs.js
          node --check scripts/m5m_build_runtime.js
      - name: Smoke checks
        run: |
          grep -q 'v1.2.8' index.html
          grep -q '>Дни<' index.html
          grep -q 'm5-algorithm-history.json' runtime-direct.js
          grep -q 'm5-algorithm-history.json' scripts/m5m_build_runtime.js
          test -s data/m5-algorithm-history.json
      - name: Remove patch helper
        run: rm -f APPLY_M5M_ALGO_DAYS_V128.py
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js runtime-direct.js sw.js matrix-result-signs.js scripts/m5m_build_runtime.js data/m5-runtime.json data/m5-algorithm-history.json
          git add -u APPLY_M5M_ALGO_DAYS_V128.py
          git commit -m 'M5M v1.2.8: matrix window by days and stable full schedule'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
